_schema-version: 3.3.0
ID: bookshop-uwase
version: 1.0.0
description: "Welcome to your new CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: bookshop-srv-uwase
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: bookshop-destination-uwase
      - name: bookshop-db-uwase
      - name: bookshop-auth-uwase
  - name: bookshop-db-deployer-uwase
    type: hdb
    path: gen/db
    requires:
      - name: bookshop-db-uwase
resources:
  - name: bookshop-destination-uwase
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: bookshop-db-uwase
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: bookshop-auth-uwase
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

